<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horloge Éducative</title>
    <link rel="stylesheet" href="horloge.css">
</head>
<body>
    <main class="clock-container">
        <!-- SVG ViewBox pour redimensionnement fluide. touch-action="none" délégué au CSS ou ici pour bloquer le scroll natif -->
        <svg class="analog-clock" id="analog-clock" viewBox="-20 -20 240 240" width="100%" height="100%" aria-label="Horloge analogique interactive">
            <defs>
                <!-- Filtre optionnel pour l'ombre des aiguilles -->
                <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
                </filter>
            </defs>

            <!-- Cadran -->
            <circle cx="100" cy="100" r="95" stroke="#333" stroke-width="2" fill="#fff"/>
            
            <g id="clock-marks"></g>

            <g id="clock-numbers"></g>

            <!-- Aiguille des minutes -->
            <line id="hand-minute" class="draggable" data-type="minute" 
                  x1="100" y1="100" x2="100" y2="24" 
                  stroke="#0b00a4" stroke-width="4" stroke-linecap="round" 
                  />

            <!-- Aiguille des heures -->
            <line id="hand-hour" class="draggable" data-type="hour" 
                  x1="100" y1="100" x2="100" y2="50" 
                  stroke="#e74c3c" stroke-width="6" stroke-linecap="round" 
                  />
                  
            <!-- Axe central -->
            <circle cx="100" cy="100" r="6" fill="#333"/>
            <circle cx="100" cy="100" r="3" fill="#fff"/>
        </svg>
        
        <section class="controls-container">
            <div class="digital-time">
                <div class="digital-time-hours" id="digital-time-hours">
                    12
                </div>
                :
                <div class="digital-time-minutes" id="digital-time-minutes">
                    00
                </div>
            </div>
            <div class="digital-time-ampm" id="digital-time-ampm">
                Matin
            </div>
            <button id="toggle-display" type="button">
                Afficher/Masquer l'heure
            </button>
            <div class="options">
                <button id="toggle-ampm" type="button">
                    matin / après-midi
                </button>
                <button id="toggle-h-number" type="button">
                    Chiffres des heures
                </button>
            </div>
            <div class="options">
                <button id="toggle-m-number" type="button">
                    Chiffres des minutes
                </button>
                <button id="toggle-quarters" type="button">
                    Quarts d'heure
                </button>
            </div>
        </section>
    </main>
    <script defer src="./horloge.js"></script>
</body>
</html>
