<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horloge Éducative</title>
    <link rel="stylesheet" href="horloge.css">
</head>
<body>
    <main class="clock-container">
        <!-- SVG ViewBox pour redimensionnement fluide. touch-action="none" délégué au CSS ou ici pour bloquer le scroll natif -->
        <svg class="analog-clock" id="analog-clock" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Horloge analogique interactive">
            <defs>
                <!-- Filtre optionnel pour l'ombre des aiguilles -->
                <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
                </filter>
            </defs>

            <!-- Cadran -->
            <circle cx="100" cy="100" r="95" stroke="#333" stroke-width="2" fill="#fff"/>
            
            <!-- Repères horaires (générables via JS, mais statiques ici pour les performances) -->
            
            <!--
            <g id="clock-marks" stroke="#333" stroke-width="2" stroke-linecap="round">
                <line x1="100" y1="10" x2="100" y2="20" />
                <line x1="190" y1="100" x2="180" y2="100" />
                <line x1="100" y1="190" x2="100" y2="180" />
                <line x1="10" y1="100" x2="20" y2="100" />
            </g>
            -->
            
            <g id="clock-marks"></g>

            <!-- Aiguille des heures -->
            <line id="hand-hour" class="draggable" data-type="hour" 
                  x1="100" y1="100" x2="100" y2="45" 
                  stroke="#2c3e50" stroke-width="6" stroke-linecap="round" 
                  />
                  
            <!-- Aiguille des minutes -->
            <line id="hand-minute" class="draggable" data-type="minute" 
                  x1="100" y1="100" x2="100" y2="20" 
                  stroke="#e74c3c" stroke-width="4" stroke-linecap="round" 
                  />
                  
            <!-- Axe central -->
            <circle cx="100" cy="100" r="6" fill="#333"/>
            <circle cx="100" cy="100" r="3" fill="#fff"/>
        </svg>
        
        <section class="controls-container">
            <div id="digital-display" class="digital-time" aria-live="polite">12:00</div>
            <button id="toggle-display" type="button" aria-controls="digital-display">
                Afficher/Masquer l'heure
            </button>
        </section>
    </main>

    <!-- Import du script en tant que module (permet strict mode implicite et encapsulation) 
    <script type="module" src="./horloge.js"></script>-->
    <script defer src="./horloge.js"></script>
</body>
</html>
